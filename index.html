<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a1a;--bg2:#111128;--bg3:#1a1a3e;--border:#2a2a4a;
  --gold:#f0c040;--blue:#40c0f0;--green:#40c080;--red:#c04040;--purple:#c090f0;
  --text:#e0e8ff;--muted:#6a7a9a;
}
.light{
  --bg:#f0f4ff;--bg2:#fff;--bg3:#e8eeff;--border:#c0c8e8;
  --gold:#c08000;--blue:#0080c0;--green:#008040;--red:#c00000;--purple:#8000c0;
  --text:#1a1a3a;--muted:#6070a0;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;transition:background 0.3s,color 0.3s;font-size:14px;}

/* HEADER */
.hdr{background:var(--bg3);border-bottom:2px solid var(--gold);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100;}
.hdr-title{font-size:1.1em;font-weight:900;color:var(--gold);}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.streak-badge{background:linear-gradient(135deg,#ff6020,#ff9040);color:#fff;padding:4px 10px;border-radius:20px;font-weight:700;font-size:0.85em;}
.icon-btn{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--text);font-size:0.85em;transition:all 0.2s;}
.icon-btn:hover{border-color:var(--gold);}

/* NAV */
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;gap:2px;padding:6px 6px 0;}
.nav-btn{padding:8px 12px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.78em;border-bottom:3px solid transparent;transition:all 0.2s;white-space:nowrap;border-radius:6px 6px 0 0;}
.nav-btn:hover{color:var(--gold);background:rgba(240,192,64,0.05);}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(240,192,64,0.08);}

.main{padding:14px;max-width:900px;margin:0 auto;}
.page{display:none;}.page.active{display:block;}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.card-gold{border-color:var(--gold);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:500px){.grid2,.grid3{grid-template-columns:1fr;}}

/* STAT BOXES */
.stat-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.stat-num{font-size:1.8em;font-weight:900;}
.stat-lbl{font-size:0.7em;color:var(--muted);}

/* BUTTONS */
.btn{padding:9px 20px;border:none;border-radius:10px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:0.85em;transition:all 0.2s;margin:3px;}
.btn-g{background:var(--gold);color:#0a0a1a;}
.btn-g:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-s{background:var(--bg3);color:var(--text);}
.btn-r{background:var(--red);color:#fff;}
.btn-b{background:var(--blue);color:#0a0a1a;}
.btn-p{background:var(--purple);color:#0a0a1a;}
.btn-sm{padding:5px 12px;font-size:0.78em;}

/* PROGRESS BAR */
.pbar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0;}
.pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));border-radius:3px;transition:width 0.4s;}

/* QUESTIONS */
.qcard{background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;animation:slideIn 0.25s ease;}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.qcard.correct{border-color:var(--green);background:rgba(64,192,128,0.04);}
.qcard.wrong{border-color:var(--red);background:rgba(192,64,64,0.04);}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.q-num{background:var(--gold);color:#0a0a1a;font-weight:900;font-size:0.72em;padding:2px 10px;border-radius:20px;}
.diff-badge{font-size:0.65em;padding:2px 8px;border-radius:10px;font-weight:700;}
.diff-e{background:rgba(64,192,128,0.2);color:var(--green);}
.diff-m{background:rgba(240,192,64,0.2);color:var(--gold);}
.diff-h{background:rgba(192,64,64,0.2);color:var(--red);}
.subj-badge{font-size:0.65em;padding:2px 8px;border-radius:10px;font-weight:700;}
.sb-hist{background:rgba(192,144,240,0.2);color:var(--purple);}
.sb-geo{background:rgba(64,192,128,0.2);color:var(--green);}
.q-text{font-size:0.95em;font-weight:600;line-height:1.6;margin-bottom:12px;}
.opts{display:flex;flex-direction:column;gap:7px;}
.opt{background:var(--bg3);border:1.5px solid var(--border);border-radius:9px;padding:10px 14px;text-align:right;cursor:pointer;font-family:'Cairo',sans-serif;font-size:0.85em;color:var(--text);transition:all 0.18s;display:flex;align-items:center;gap:10px;}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(-2px);}
.opt.correct{background:rgba(64,192,128,0.1);border-color:var(--green);color:var(--green);}
.opt.wrong{background:rgba(192,64,64,0.1);border-color:var(--red);color:var(--red);}
.opt.reveal{background:rgba(64,192,128,0.05);border-color:var(--green);color:var(--green);opacity:0.7;}
.opt:disabled{cursor:default;}
.opt-ltr{width:24px;height:24px;background:var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.78em;flex-shrink:0;color:var(--gold);}
.opt.correct .opt-ltr{background:var(--green);color:#fff;}
.opt.wrong .opt-ltr{background:var(--red);color:#fff;}
.opt.reveal .opt-ltr{background:var(--green);color:#fff;}
.exp{margin-top:10px;padding:10px 14px;background:var(--bg3);border-right:3px solid var(--blue);border-radius:8px;font-size:0.82em;color:var(--blue);line-height:1.7;}

/* TIMER */
.timer-bar{height:5px;background:var(--border);border-radius:3px;margin-bottom:12px;overflow:hidden;}
.timer-fill{height:100%;border-radius:3px;transition:width 0.1s linear;}
.timer-display{font-size:1.4em;font-weight:900;text-align:center;margin:8px 0;}

/* FLASHCARD */
.fc-scene{perspective:1000px;width:100%;max-width:500px;margin:0 auto 20px;}
.fc-card{width:100%;height:200px;position:relative;transform-style:preserve-3d;transition:transform 0.5s;cursor:pointer;}
.fc-card.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:1em;font-weight:600;line-height:1.6;}
.fc-front{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:2px solid var(--gold);color:var(--text);}
.fc-back{background:linear-gradient(135deg,rgba(64,192,128,0.15),var(--bg2));border:2px solid var(--green);color:var(--green);transform:rotateY(180deg);}
.fc-hint{text-align:center;color:var(--muted);font-size:0.78em;margin-bottom:10px;}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.ach-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;transition:all 0.2s;}
.ach-item.unlocked{border-color:var(--gold);background:rgba(240,192,64,0.08);}
.ach-icon{font-size:2em;margin-bottom:6px;}
.ach-name{font-size:0.75em;font-weight:700;color:var(--gold);}
.ach-desc{font-size:0.65em;color:var(--muted);margin-top:4px;}
.ach-locked{opacity:0.4;}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0;}
.cal-day{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.65em;font-weight:700;}
.cal-done{background:var(--green);color:#fff;}
.cal-miss{background:var(--border);color:var(--muted);}
.cal-today{background:var(--gold);color:#0a0a1a;}
.cal-future{background:var(--bg3);color:var(--border);}

/* WEAK POINTS */
.wp-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.wp-label{font-size:0.8em;min-width:160px;color:var(--text);}
.wp-track{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden;}
.wp-fill-good{height:100%;background:var(--green);border-radius:5px;}
.wp-fill-mid{height:100%;background:var(--gold);border-radius:5px;}
.wp-fill-bad{height:100%;background:var(--red);border-radius:5px;}
.wp-pct{font-size:0.78em;font-weight:700;min-width:35px;text-align:left;}

/* STREAK */
.streak-fire{font-size:2.5em;text-align:center;}
.combo-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#0a0a1a;padding:8px 24px;border-radius:20px;font-weight:900;font-size:1em;z-index:999;animation:toast 1.5s ease forwards;pointer-events:none;}
@keyframes toast{0%{opacity:0;top:60px}20%{opacity:1;top:80px}80%{opacity:1;top:80px}100%{opacity:0;top:100px}}

/* SUMMARY */
.summary-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.summary-header{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;}
.summary-header:hover{background:rgba(240,192,64,0.05);}
.summary-body{padding:14px 16px;border-top:1px solid var(--border);display:none;font-size:0.85em;line-height:1.8;}
.summary-body.open{display:block;}
.kw{background:rgba(240,192,64,0.15);color:var(--gold);padding:1px 6px;border-radius:4px;font-weight:600;}

/* SEARCH */
.search-box{width:100%;padding:10px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'Cairo',sans-serif;font-size:0.9em;margin-bottom:12px;}
.search-box:focus{outline:none;border-color:var(--gold);}
.search-result{padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;}
.search-result:hover{border-color:var(--gold);}
.sr-term{font-weight:700;color:var(--gold);}
.sr-def{font-size:0.82em;color:var(--muted);margin-top:2px;}
mark{background:rgba(240,192,64,0.3);color:var(--gold);border-radius:2px;}

/* LEADERBOARD */
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;}
.lb-rank{font-size:1.3em;font-weight:900;width:30px;text-align:center;}
.lb-info{flex:1;}
.lb-name{font-weight:700;font-size:0.9em;}
.lb-score{font-size:0.75em;color:var(--muted);}
.lb-pct{font-weight:900;color:var(--gold);}

/* REVIEW WRONG */
.rw-card{background:rgba(192,64,64,0.06);border:1.5px solid var(--red);border-radius:10px;padding:14px;margin-bottom:10px;}
.rw-q{font-weight:600;font-size:0.9em;margin-bottom:8px;}
.rw-your{color:var(--red);font-size:0.83em;margin-bottom:4px;}
.rw-correct{color:var(--green);font-size:0.83em;}

/* RESULTS */
.res-panel{background:var(--bg3);border:2px solid var(--gold);border-radius:14px;padding:24px;text-align:center;margin-bottom:16px;}
.score-circle{width:110px;height:110px;border-radius:50%;border:4px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 14px;background:var(--bg);}

/* KEYBOARD HINT */
.kb-hint{text-align:center;color:var(--muted);font-size:0.72em;margin-top:8px;}

/* NOTIFICATION */
.notif{position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--gold);border-radius:10px;padding:12px 18px;z-index:999;animation:slideInNotif 0.3s ease;max-width:280px;}
@keyframes slideInNotif{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>

<!-- COMBO TOAST placeholder -->
<div id="combo-toast" style="display:none"></div>

<div class="hdr">
  <div class="hdr-title">🎓 باك 1 — الاجتماعيات</div>
  <div class="hdr-right">
    <div class="streak-badge" id="streak-display">🔥 0</div>
    <button class="icon-btn" onclick="toggleSound()" id="sound-btn">🔔 صوت</button>
    <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">🌙 ليلي</button>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="showPage('home',this)">🏠 الرئيسية</button>
  <button class="nav-btn" onclick="showPage('quiz',this)">📝 امتحان</button>
  <button class="nav-btn" onclick="showPage('daily',this)">📅 يومي</button>
  <button class="nav-btn" onclick="showPage('flash',this)">🃏 بطاقات</button>
  <button class="nav-btn" onclick="showPage('summary',this)">📖 ملخصات</button>
  <button class="nav-btn" onclick="showPage('search',this)">🔍 بحث</button>
  <button class="nav-btn" onclick="showPage('weak',this)">📊 نقاط ضعف</button>
  <button class="nav-btn" onclick="showPage('ach',this)">🏅 إنجازات</button>
  <button class="nav-btn" onclick="showPage('lb',this)">🏆 المتصدرون</button>
</div>

<div class="main">

<!-- HOME -->
<div id="page-home" class="page active">
  <div class="card card-gold" style="text-align:center;padding:20px;">
    <div style="font-size:2em;">🎓</div>
    <div style="font-size:1.2em;font-weight:900;color:var(--gold);margin:6px 0;">مرحباً بك في تطبيق الباك</div>
    <div style="color:var(--muted);font-size:0.85em;">خطاطات الأستاذ علي زهيني | التاريخ والجغرافيا</div>
  </div>
  <div class="grid3" style="margin-bottom:12px;">
    <div class="stat-box"><div class="stat-num" style="color:var(--gold);" id="h-total-score">0</div><div class="stat-lbl">إجمالي النقاط</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--green);" id="h-streak">0</div><div class="stat-lbl">سلسلة 🔥</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--blue);" id="h-answered">0</div><div class="stat-lbl">أسئلة أُجيب عنها</div></div>
  </div>
  <div style="font-weight:700;margin-bottom:10px;color:var(--gold);">🚀 ابدأ سريعاً</div>
  <div class="grid2">
    <button class="btn btn-g" style="width:100%;padding:14px;" onclick="startExam('hist','all',false)">📜 امتحان التاريخ</button>
    <button class="btn btn-b" style="width:100%;padding:14px;" onclick="startExam('geo','all',false)">🌍 امتحان الجغرافيا</button>
    <button class="btn btn-p" style="width:100%;padding:14px;" onclick="startExam('mixed','all',false)">🔀 امتحان شامل</button>
    <button class="btn btn-r" style="width:100%;padding:14px;" onclick="startTimedExam()">⏱️ امتحان موقوت</button>
  </div>
  <div style="margin-top:12px;">
    <button class="btn btn-s" style="width:100%;" onclick="startQuickReview()">⚡ مراجعة سريعة (5 دقائق)</button>
  </div>
  <div id="daily-streak-cal" style="margin-top:14px;"></div>
</div>

<!-- QUIZ -->
<div id="page-quiz" class="page">
  <div id="quiz-config">
    <div class="card">
      <div style="font-weight:700;color:var(--gold);margin-bottom:10px;">⚙️ إعداد الامتحان</div>
      <div style="margin-bottom:10px;">
        <div style="font-size:0.8em;color:var(--muted);margin-bottom:6px;">المادة:</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-g btn-sm" onclick="setSubj('hist',this)">📜 التاريخ</button>
          <button class="btn btn-s btn-sm" onclick="setSubj('geo',this)">🌍 الجغرافيا</button>
          <button class="btn btn-s btn-sm" onclick="setSubj('mixed',this)">🔀 مختلط</button>
        </div>
      </div>
      <div style="margin-bottom:10px;">
        <div style="font-size:0.8em;color:var(--muted);margin-bottom:6px;">الصعوبة:</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-s btn-sm" onclick="setDiff('all',this)">الكل ✓</button>
          <button class="btn btn-s btn-sm" onclick="setDiff('easy',this)">سهل</button>
          <button class="btn btn-s btn-sm" onclick="setDiff('medium',this)">متوسط</button>
          <button class="btn btn-s btn-sm" onclick="setDiff('hard',this)">صعب</button>
        </div>
      </div>
      <div style="margin-bottom:10px;">
        <div style="font-size:0.8em;color:var(--muted);margin-bottom:6px;">الموقت:</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-s btn-sm" onclick="setTimer(0,this)">بدون ✓</button>
          <button class="btn btn-s btn-sm" onclick="setTimer(30,this)">30ث/سؤال</button>
          <button class="btn btn-s btn-sm" onclick="setTimer(60,this)">60ث/سؤال</button>
          <button class="btn btn-s btn-sm" onclick="setTimer(900,this)">15د إجمالي</button>
        </div>
      </div>
      <button class="btn btn-g" style="width:100%;" onclick="launchQuiz()">🚀 ابدأ الامتحان</button>
    </div>
  </div>
  <div id="quiz-area" style="display:none;"></div>
  <div id="quiz-review" style="display:none;"></div>
</div>

<!-- DAILY -->
<div id="page-daily" class="page">
  <div id="daily-area"></div>
</div>

<!-- FLASHCARDS -->
<div id="page-flash" class="page">
  <div id="flash-area"></div>
</div>

<!-- SUMMARY -->
<div id="page-summary" class="page">
  <div id="summary-area"></div>
</div>

<!-- SEARCH -->
<div id="page-search" class="page">
  <input class="search-box" placeholder="🔍 ابحث عن مفهوم أو مصطلح..." oninput="doSearch(this.value)" id="search-input">
  <div id="search-results"></div>
</div>

<!-- WEAK POINTS -->
<div id="page-weak" class="page">
  <div id="weak-area"></div>
</div>

<!-- ACHIEVEMENTS -->
<div id="page-ach" class="page">
  <div id="ach-area"></div>
</div>

<!-- LEADERBOARD -->
<div id="page-lb" class="page">
  <div id="lb-area"></div>
</div>

</div><!-- end main -->

<script>
// ==================== DATA ====================
const LETTERS = ['أ','ب','ج','د'];

// All questions with difficulty
const ALL_Q = [
  // HISTORY L1
  {id:1,s:'hist',l:1,d:'medium',q:"ما هي المرحلة المتقدمة في تطور النظام الرأسمالي التي تغيرت فيها وظيفة الأبناك لتصبح استثمارية؟",opts:["الرأسمالية التجارية","الرأسمالية الصناعية","الرأسمالية المالية","الاشتراكية"],a:2,exp:"الرأسمالية المالية: تغيرت وظيفة الأبناك لتصبح استثمارية وبرزت الشركات مجهولة الاسم والهولدنغ."},
  {id:2,s:'hist',l:1,d:'easy',q:"من هو زعيم التيار الاشتراكي الطوباوي الذي اقترح تنظيم المجتمع في إطار تعاوني؟",opts:["كارل ماركس","برودون","سان سيمون","انغلز"],a:2,exp:"سان سيمون: زعيم التيار الطوباوي الذي اقترح تنظيم المجتمع في إطار تعاوني تسود فيه المساواة."},
  {id:3,s:'hist',l:1,d:'easy',q:"ما هو التيار الاشتراكي الذي دعا إلى إزالة الدولة نهائياً؟",opts:["الطوباوية","الفوضوية","العلمية","الليبرالية"],a:1,exp:"الفوضوية: تزعمها برودون، اقترح ضرورة التخلي النهائي على الدولة وتعويضها بجمعيات."},
  {id:4,s:'hist',l:1,d:'medium',q:"ما هي المكتسبات التي حققتها الطبقة العاملة في القرن 19م؟",opts:["تأسيس الشركات","تحديد ساعات العمل والاعتراف بالعمل النقابي وحق الإضراب","السيطرة على الإنتاج","الهيمنة على الحكومات"],a:1,exp:"من أهم المكتسبات: تحديد ساعات العمل، الاعتراف بالعمل النقابي وحق الإضراب، الرفع من الأجور."},
  {id:5,s:'hist',l:1,d:'hard',q:"ما الذي ميّز الرأسمالية المالية عن الرأسمالية الصناعية؟",opts:["ظهور المصانع","تغيير وظيفة الأبناك لتصبح استثمارية وبروز الشركات مجهولة الاسم والهولدنغ وبورصة الأوراق المالية","ظهور النقابات","الاستثمار في الفلاحة"],a:1,exp:"الرأسمالية المالية: تغيرت وظيفة الأبناك لتصبح استثمارية، كما برزت الشركات مجهولة الاسم والهولدنغ، وتعززت دور البورصة."},
  // HISTORY L2
  {id:6,s:'hist',l:2,d:'easy',q:"ما هو السبب المباشر لاندلاع الحرب العالمية الأولى؟",opts:["أزمة المغرب","اغتيال ولي عهد النمسا في سراييفو يوم 28 يونيو 1914","توقيع الوفاق الثلاثي","مؤتمر برلين"],a:1,exp:"اغتيال ولي عهد النمسا وزوجته في سراييفو بدولة البوسنة من طرف طالب صربي يوم 28 يونيو 1914."},
  {id:7,s:'hist',l:2,d:'medium',q:"متى تأسس الوفاق الثلاثي؟",opts:["1879","1892","1904","1907"],a:3,exp:"1907: تشكل الوفاق الثلاثي الذي ضم فرنسا وإنجلترا وروسيا."},
  {id:8,s:'hist',l:2,d:'medium',q:"ما الذي تضمنه مؤتمر الجزيرة الخضراء 1906؟",opts:["اقتسام إفريقيا","حل النزاع بين فرنسا وألمانيا حول المغرب وإعطاء امتيازات أمنية لفرنسا","ترسيم الحدود المغربية الجزائرية","الاعتراف باستقلال المغرب"],a:1,exp:"مؤتمر الجزيرة الخضراء 1906: أعطى لفرنسا امتيازات أمنية مقابل الحفاظ على المصالح الاقتصادية الألمانية بالمغرب."},
  {id:9,s:'hist',l:2,d:'hard',q:"ما هو مضمون أزمة أكادير 1911؟",opts:["غزو فرنسا لمدينة أكادير","إرسال ألمانيا سفينة حربية قبالة سواحل أكادير احتجاجاً على التدخل الفرنسي في المناطق المغربية وحُلّت بتنازل فرنسا عن حوض الكونغو","هجوم إسبانيا على الجنوب المغربي","اندلاع ثورة محلية في أكادير"],a:1,exp:"أزمة أكادير 1911: إرسال ألمانيا سفينة حربية قبالة سواحل أكادير، وحُلّت بتنازل فرنسا على حوض الكونغو وتنازل ألمانيا عن المغرب."},
  {id:10,s:'hist',l:2,d:'easy',q:"ما هو التحالف الثلاثي الذي ضم ألمانيا والنمسا وإيطاليا؟",opts:["الوفاق الثلاثي","الحلف الفرنسي","التحالف الثلاثي","تحالف برلين"],a:2,exp:"التحالف الثلاثي: تشكل بانضمام إيطاليا إلى النمسا وألمانيا سنة 1882."},
  // HISTORY L3
  {id:11,s:'hist',l:3,d:'easy',q:"من هم رواد التيار السلفي الإصلاحي في المشرق العربي؟",opts:["فرح أنطوان وقاسم أمين","جمال الدين الأفغاني ومحمد عبده وعبد الرحمان الكواكبي","أديب إسحاق وأنطوان","ماركس وانغلز"],a:1,exp:"رواد التيار السلفي الإصلاحي: جمال الدين الأفغاني ومحمد عبده وعبد الرحمان الكواكبي."},
  {id:12,s:'hist',l:3,d:'medium',q:"ما هو التيار الفكري الذي دعا إلى فصل الدين عن الدولة في المشرق العربي؟",opts:["التيار السلفي الإصلاحي","التيار العلماني الليبرالي","التيار الاشتراكي","التيار القومي"],a:1,exp:"التيار العلماني الليبرالي: دعا إلى فصل الدين عن الدولة، من أهم رواده فرح أنطوان وقاسم أمين وأديب إسحاق."},
  {id:13,s:'hist',l:3,d:'medium',q:"ما هي نتائج اليقظة الفكرية بالمشرق العربي؟",opts:["انهيار الدولة العثمانية","إحياء اللغة العربية وظهور وعي قومي وانتشار المُثل القومية","السيطرة الأوروبية","تأسيس الجامعة العربية"],a:1,exp:"من نتائج اليقظة الفكرية: إحياء اللغة العربية، ظهور وعي وطني قومي، انتشار المُثل القومية بدل المُثل الدينية الطائفية."},
  // HISTORY L4
  {id:14,s:'hist',l:4,d:'easy',q:"ما هي معركة إسلي 1844 وما نتيجتها؟",opts:["انتصار المغرب على فرنسا","انهزام المغرب أمام فرنسا بسبب دعمه للأمير عبد القادر وتوقيع معاهدة لالة مغنية 1845","انهزام المغرب أمام إسبانيا","حرب المغرب وإنجلترا"],a:1,exp:"معركة إسلي 1844: انهزم المغرب أمام فرنسا ووُقِّعت معاهدة لالة مغنية 1845 لترسيم الحدود."},
  {id:15,s:'hist',l:4,d:'medium',q:"ما هي شروط معاهدة الصلح 1860 مع إسبانيا بعد حرب تطوان؟",opts:["تنازل المغرب عن الجزائر","فرض غرامة مالية 20 مليون ريال وتوسيع حدود سبتة وإقامة مركز للصيد البحري","تنازل عن شمال المغرب","إنشاء قواعد عسكرية إسبانية"],a:1,exp:"شروط 1860: فرض غرامة مالية 20 مليون ريال إسباني، توسيع حدود سبتة، إقامة مركز للصيد البحري في الجنوب."},
  {id:16,s:'hist',l:4,d:'hard',q:"ما هو نظام الحمايات القنصلية وما تأثيره؟",opts:["نظام تجاري","حماية تمنحها الدول الأوروبية لبعض المغاربة تجعلهم خارج سلطة المخزن وتعفيهم من الضرائب","نظام عسكري","نظام دبلوماسي"],a:1,exp:"الحمايات القنصلية: حماية كان بعض ممثلي الدول الأوروبية يمنحونها لبعض المغاربة مما أعفاهم من أداء الضرائب والمتابعة بالقضاء الشرعي."},
  // HISTORY L5
  {id:17,s:'hist',l:5,d:'easy',q:"ما هي معاهدة فرساي 1919 ومع من؟",opts:["مع النمسا","مع ألمانيا","مع بلغاريا","مع الدولة العثمانية"],a:1,exp:"معاهدة فرساي 1919: أُبرمت مع ألمانيا وفُرضت عليها شروط قاسية."},
  {id:18,s:'hist',l:5,d:'medium',q:"كم عدد مبادئ ويلسون للسلام؟",opts:["5","10","14","20"],a:2,exp:"14 مبدأً عرضها الرئيس الأمريكي ويلسون على مؤتمر السلام بباريس."},
  {id:19,s:'hist',l:5,d:'medium',q:"ما هو السبب الرئيسي لأزمة 1929؟",opts:["الحرب العالمية الأولى","انطلاق الأزمة من بورصة وول ستريت بنيويورك بسبب تراجع الصادرات وانهيار أسعار الأسهم","الثورة البلشفية","ارتفاع أسعار البترول"],a:1,exp:"انطلقت الأزمة من بورصة وول ستريت بنيويورك يوم الخميس 24 أكتوبر 1929."},
  {id:20,s:'hist',l:5,d:'hard',q:"ما هي الثورة البلشفية 1917 وأهم مراسيمها؟",opts:["ثورة فرنسية","ثورة روسية قادها لينين وأصدر مراسيم السلام والأراضي والقوميات","ثورة ألمانية","انقلاب عسكري إيطالي"],a:1,exp:"الثورة البلشفية أكتوبر 1917: قادها لينين وأصدر مراسيم السلام والأراضي والقوميات وأسس الدولة الاشتراكية."},
  // HISTORY L6
  {id:21,s:'hist',l:6,d:'easy',q:"ما هو السبب المباشر لاندلاع الحرب العالمية الثانية؟",opts:["اغتيال هتلر","هجوم هتلر على بولونيا في فاتح شتنبر 1939","الأزمة الاقتصادية 1929","توقيع معاهدة فرساي"],a:1,exp:"في فاتح شتنبر 1939 قام هتلر بالهجوم على بولونيا مما أدى إلى تدخل فرنسا وإنجلترا."},
  {id:22,s:'hist',l:6,d:'medium',q:"متى استسلمت ألمانيا في الحرب العالمية الثانية؟",opts:["2 شتنبر 1945","8 ماي 1945","6 يونيو 1944","1 سبتمبر 1944"],a:1,exp:"استسلمت ألمانيا في 8 ماي 1945 بعد معركة ستالينغراد."},
  {id:23,s:'hist',l:6,d:'medium',q:"ما هي دول المحور في الحرب العالمية الثانية؟",opts:["فرنسا وإنجلترا وروسيا","ألمانيا وإيطاليا واليابان","الولايات المتحدة وإنجلترا وفرنسا","الاتحاد السوفياتي وألمانيا"],a:1,exp:"دول المحور: تحالف يضم الدول ذات الأنظمة الديكتاتورية كألمانيا وإيطاليا واليابان."},
  {id:24,s:'hist',l:6,d:'hard',q:"ما هو مفهوم الحرب الباردة ومتى انتهت؟",opts:["حرب عسكرية بين أمريكا وروسيا","الصراع الإيديولوجي بين المعسكر الشرقي والغربي، استمر حتى 1991","صراع اقتصادي بين أمريكا وأوروبا","صراع دول عربية والغرب"],a:1,exp:"الحرب الباردة: الصراع الإيديولوجي بين المعسكر الشرقي بزعامة الاتحاد السوفياتي والمعسكر الغربي بزعامة الولايات المتحدة، استمر حتى 1991."},
  // HISTORY L7
  {id:25,s:'hist',l:7,d:'easy',q:"متى فُرض نظام الحماية على المغرب وعلى من؟",opts:["30 مارس 1912 على المولى عبد الحفيظ","1 يناير 1900 على الحسن الأول","20 مارس 1956 على محمد الخامس","15 أبريل 1912 على مولاي عبد العزيز"],a:0,exp:"فُرض نظام الحماية على السلطان المولى عبد الحفيظ يوم 30 مارس 1912 (معاهدة فاس)."},
  {id:26,s:'hist',l:7,d:'medium',q:"ما هو نظام الحماية؟",opts:["استعمار مباشر","نظام يقوم على احتفاظ البلد المستعمَر بسيادته إلى جانب إدارة أجنبية مراقبة يترأسها مقيم عام","نظام ديمقراطي","نظام اتحادي"],a:1,exp:"نظام الحماية: يقوم على احتفاظ البلد المستعمر بسيادته ونظام حكمه السائد إلى جانب إدارة استعمارية مراقبة يترأسها مقيم عام أو مفوض سامٍ."},
  {id:27,s:'hist',l:7,d:'hard',q:"ما هي الانعكاسات الاجتماعية للاستغلال الاستعماري على المغرب؟",opts:["تحسن الأوضاع الاجتماعية","تضرر الفلاحين والحرفيين وتزايد الفقر والبطالة وارتفاع الأسعار وظهور أحياء الصفيح","انتشار التعليم والرفاه","هجرة المستعمرين"],a:1,exp:"تضرر وضعية الفلاحين والحرفيين، تزايد الفقر والبطالة، ارتفاع الأسعار، تزايد الهجرة القروية، ظهور أحياء الصفيح."},
  // HISTORY L8
  {id:28,s:'hist',l:8,d:'easy',q:"ما هو الظهير البربري ومتى أُصدر؟",opts:["ظهير لحماية الأمازيغ","ظهير أصدره المقيم الفرنسي بتاريخ 16 ماي 1930 بهدف التفريق بين العرب والأمازيغ","قانون إصلاح التعليم","ظهير الاستقلال"],a:1,exp:"الظهير البربري 16 ماي 1930: استهدف ضرب وحدة المجتمع المغربي وإخضاع الأمازيغ للعرف القبلي والقانون الفرنسي."},
  {id:29,s:'hist',l:8,d:'medium',q:"ما هي وثيقة المطالبة بالاستقلال؟",opts:["رسالة من السلطان لفرنسا","وثيقة قدمها حزب الاستقلال بزعامة علال الفاسي بتاريخ 11 يناير 1944 بـ66 توقيعاً","بيان عسكري","وثيقة مؤتمر أنفا"],a:1,exp:"وثيقة المطالبة بالاستقلال: 11 يناير 1944، قدمها حزب الاستقلال بزعامة علال الفاسي مُذيَّلة بـ66 توقيعاً."},
  {id:30,s:'hist',l:8,d:'medium',q:"متى حصل المغرب على الاستقلال وبعد أي مفاوضات؟",opts:["1 يناير 1956","2 مارس 1956 بعد مفاوضات إيكس ليبان","20 غشت 1955","11 يناير 1944"],a:1,exp:"2 مارس 1956: توقيع معاهدة الاستقلال بعد مفاوضات إيكس ليبان (Aix-les-Bains)."},
  {id:31,s:'hist',l:8,d:'hard',q:"لماذا نُفي السلطان محمد الخامس سنة 1953؟",opts:["بسبب رفضه معاهدة فاس","بسبب خطابَي طنجة 1947 وخطاب العرش 1952 ورفضه التوقيع على الظهائر الإصلاحية الفرنسية","بسبب دعمه للثورة الجزائرية","بسبب مطالبته بوحدة إفريقيا"],a:1,exp:"نُفي السلطان محمد الخامس يوم 20 غشت 1953 بعد خطابَي طنجة 1947 وخطاب العرش 1952 اللذَين طالب فيهما باستقلال المغرب ورفضه التوقيع على الظهائر الإصلاحية."},
  {id:32,s:'hist',l:8,d:'medium',q:"ما هي معركة أنوال 1921 ولماذا تشتهر؟",opts:["انتصار فرنسا على المغرب","انتصار المقاومة المغربية بقيادة محمد بن عبد الكريم الخطابي على إسبانيا","انهزام المقاومة أمام إسبانيا","معركة بين المغرب والجزائر"],a:1,exp:"معركة أنوال 1921: من أشهر معارك مقاومة الريف، انتصرت فيها المقاومة المغربية بزعامة محمد بن عبد الكريم الخطابي على إسبانيا."},

  {id:33,s:'geo',l:1,d:'easy',q:"ما هو مؤشر التنمية البشرية ويرتكز على كم بُعد؟",opts:["مؤشر يعتمد على الدخل فقط","مؤشر تركيبي يعتمد على ثلاثة أبعاد: الصحة والتعليم والدخل الفردي","مؤشر يقيس النمو الاقتصادي","مؤشر الكثافة السكانية"],a:1,exp:"مؤشر التنمية البشرية: مؤشر تركيبي يعتمد على ثلاثة أبعاد: الصحة - التعليم - الدخل الفردي."},
  {id:34,s:'geo',l:1,d:'medium',q:"ما هي التنمية المستدامة؟",opts:["التنمية الصناعية فقط","التنمية التي تستحضر البعد البيئي وتستغل الموارد الطبيعية دون إتلافها لضمان تلبية حاجيات الأجيال القادمة","تنمية اقتصادية فقط","استغلال كل الموارد الطبيعية"],a:1,exp:"التنمية المستدامة: تستحضر البعد البيئي وتستغل الموارد الطبيعية دون إتلافها بمراعاة قدراتها على التجدد الطبيعي."},
  {id:35,s:'geo',l:1,d:'hard',q:"ما هي النظرية الاشتراكية في تفسير التخلف؟",opts:["تربطه بالمناخ","تربط التخلف بأسباب خارجية تتمثل في الاستغلال الاستعماري والتبعية الاقتصادية","تربطه بضعف الاستثمار الداخلي","تربطه بالنمو الديمغرافي"],a:1,exp:"النظرية الاشتراكية: تربط التخلف بأسباب خارجية تتمثل في الاستغلال الاستعماري والتبعية الاقتصادية."},
  // GEOGRAPHY L2
  {id:36,s:'geo',l:2,d:'easy',q:"ما هي وضعية المغرب على صعيد التنمية البشرية؟",opts:["مرتفعة جداً","مرتفعة","متوسطة","ضعيفة"],a:2,exp:"يندرج المغرب ضمن الدول ذات مستوى تنمية بشرية متوسط (نسبة البطالة 15.7%، الأمية 41%)."},
  {id:37,s:'geo',l:2,d:'medium',q:"ما هي المراحل الثلاث للنظام الديمغرافي في المغرب؟",opts:["نمو ثم تراجع ثم استقرار","النظام التقليدي (ارتفاع الولادات والوفيات)، الانتقال الديمغرافي، النظام العصري (انخفاض الولادات والوفيات)","مرحلة التصنيع والتمدن والريف","مرحلة الاستعمار والاستقلال والنمو"],a:1,exp:"المراحل الثلاث: 1-النظام التقليدي 2-الانتقال الديمغرافي 3-النظام العصري (انخفاض الولادات والوفيات)."},
  {id:38,s:'geo',l:2,d:'medium',q:"متى انطلقت المبادرة الوطنية للتنمية البشرية؟",opts:["1999","2000","2005","2010"],a:2,exp:"المبادرة الوطنية للتنمية البشرية: أعطى انطلاقتها الملك محمد السادس بتاريخ 18 ماي 2005."},
  // GEOGRAPHY L3
  {id:39,s:'geo',l:3,d:'easy',q:"ما هو مفهوم سياسة إعداد التراب الوطني؟",opts:["بناء المدن فقط","كل التدخلات التي تقوم بها السلطات العمومية لتحقيق أفضل توزيع للسكان والأنشطة وتقليص التفاوتات التنموية","سياسة الاستثمار الأجنبي","سياسة التصنيع"],a:1,exp:"سياسة إعداد التراب الوطني: كل التدخلات التي تقوم بها السلطات العمومية لتحقيق أفضل توزيع للسكان والأنشطة وتقليص التفاوتات التنموية."},

// ==================== STATE ====================
let state = {
  streak:0, maxStreak:0, totalAnswered:0, totalCorrect:0, soundOn:true, darkMode:true,
  lessonStats:{}, dailyDone:false, dailyDate:'', comboCount:0,
  quizSubj:'hist', quizDiff:'all', quizTimer:0,
  currentQ:[], currentIdx:0, currentScore:0, currentAnswered:[], qTimer:null, totalTimer:null,
  fcDeck:[], fcIdx:0, fcFlipped:false,
  scores:[], achievements:{},
  weakHistory:{}, // {lessonKey: {right, wrong}}
};

function loadState() {
  try {
    const s = localStorage.getItem('bac1_state');
    if(s) state = {...state, ...JSON.parse(s)};
  } catch(e){}
}

function saveState() {
  try { localStorage.setItem('bac1_state', JSON.stringify(state)); } catch(e){}
}

// ==================== UI ====================
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if(btn) btn.classList.add('active');
  else { document.querySelectorAll('.nav-btn').forEach(b => { if(b.textContent.includes({home:'🏠',quiz:'📝',daily:'📅',flash:'🃏',summary:'📖',search:'🔍',weak:'📊',ach:'🏅',lb:'🏆'}[id]||'')) b.classList.add('active'); }); }
  // render page
  if(id==='daily') renderDaily();
  if(id==='flash') renderFlash();
  if(id==='summary') renderSummary();
  if(id==='weak') renderWeak();
  if(id==='ach') renderAch();
  if(id==='lb') renderLb();
  if(id==='home') renderHome();
}

function toggleTheme() {
  state.darkMode = !state.darkMode;
  document.body.classList.toggle('light', !state.darkMode);
  document.getElementById('theme-btn').textContent = state.darkMode ? '🌙 ليلي' : '☀️ نهاري';
  saveState();
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  document.getElementById('sound-btn').textContent = state.soundOn ? '🔔 صوت' : '🔕 صامت';
  saveState();
}

function playSound(type) {
  if(!state.soundOn) return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  if(type==='correct') { osc.frequency.value=880; gain.gain.setValueAtTime(0.3,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3); }
  else { osc.frequency.value=220; gain.gain.setValueAtTime(0.3,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3); }
  osc.start(); osc.stop(ctx.currentTime+0.3);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'combo-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1600);
}

function showNotif(msg) {
  const n = document.createElement('div');
  n.className = 'notif';
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 3000);
}

function updateHdrStreak() {
  document.getElementById('streak-display').textContent = '🔥 ' + state.streak;
  document.getElementById('h-total-score').textContent = state.totalCorrect;
  document.getElementById('h-streak').textContent = state.maxStreak;
  document.getElementById('h-answered').textContent = state.totalAnswered;
}

// ==================== HOME ====================
function renderHome() {
  updateHdrStreak();
  // Streak calendar (last 14 days)
  const cal = document.getElementById('daily-streak-cal');
  cal.innerHTML = '<div style="font-weight:700;color:var(--gold);margin-bottom:8px;">📅 التحدي اليومي — آخر 14 يوم</div><div class="cal-grid" id="cal-days"></div>';
  const grid = document.getElementById('cal-days');
  const today = new Date();
  for(let i=13;i>=0;i--) {
    const d = new Date(today); d.setDate(today.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const div = document.createElement('div');
    div.className = 'cal-day';
    const done = (state.dailyHistory||{})[key];
    if(i===0) div.className += ' cal-today';
    else if(done) div.className += ' cal-done';
    else div.className += ' cal-miss';
    div.textContent = d.getDate();
    grid.appendChild(div);
  }
}

// ==================== QUIZ ENGINE ====================
let qTimerInterval = null;
let totalTimerInterval = null;
let timerLeft = 0;
let totalTimerLeft = 0;

function setSubj(s, btn) {
  state.quizSubj = s;
  document.querySelectorAll('#quiz-config .btn').forEach(b => {
    if(b.onclick && b.onclick.toString().includes('setSubj')) { b.className = b.className.replace('btn-g','btn-s'); }
  });
  btn.className = btn.className.replace('btn-s','btn-g');
  saveState();
}
function setDiff(d, btn) {
  state.quizDiff = d;
  document.querySelectorAll('#quiz-config .btn').forEach(b => {
    if(b.onclick && b.onclick.toString().includes('setDiff')) { b.className = b.className.replace('btn-g','btn-s'); }
  });
  btn.className = btn.className.replace('btn-s','btn-g');
  saveState();
}
function setTimer(t, btn) {
  state.quizTimer = t;
  document.querySelectorAll('#quiz-config .btn').forEach(b => {
    if(b.onclick && b.onclick.toString().includes('setTimer')) { b.className = b.className.replace('btn-g','btn-s'); }
  });
  btn.className = btn.className.replace('btn-s','btn-g');
  saveState();
}

function launchQuiz() {
  startExam(state.quizSubj, state.quizDiff, false);
}

function startExam(subj, diff, daily) {
  let qs = ALL_Q.filter(q => (subj==='mixed' || q.s===subj) && (diff==='all' || q.d===diff));
  if(daily) qs = shuffle([...qs]).slice(0,5);
  else qs = shuffle([...qs]);
  runExam(qs, subj, daily);
  if(!daily) { showPage('quiz'); document.querySelectorAll('.nav-btn')[1].classList.add('active'); document.querySelectorAll('.nav-btn')[0].classList.remove('active'); }
}

function startTimedExam() {
  state.quizTimer = 900;
  startExam('mixed','all',false);
}

function startQuickReview() {
  const summaryPage = document.getElementById('page-summary');
  showPage('summary'); document.querySelectorAll('.nav-btn')[4].classList.add('active');
}

function runExam(qs, subj, daily) {
  clearAllTimers();
  state.currentQ = qs;
  state.currentIdx = 0;
  state.currentScore = 0;
  state.currentAnswered = new Array(qs.length).fill(null);
  state.comboCount = 0;

  const area = daily ? document.getElementById('daily-area') : document.getElementById('quiz-area');
  const config = document.getElementById('quiz-config');
  const rev = document.getElementById('quiz-review');
  if(config) config.style.display = 'none';
  if(rev) rev.style.display = 'none';
  area.style.display = 'block';

  if(state.quizTimer > 0 && !daily) {
    totalTimerLeft = state.quizTimer <= 100 ? state.quizTimer * qs.length : state.quizTimer;
    totalTimerInterval = setInterval(() => {
      totalTimerLeft--;
      const el = document.getElementById('total-timer-val');
      if(el) { el.textContent = formatTime(totalTimerLeft); if(totalTimerLeft<=30) el.style.color='var(--red)'; else el.style.color='var(--gold)'; }
      if(totalTimerLeft<=0) { clearAllTimers(); finishExam(daily); }
    }, 1000);
  }
  renderExam(daily);
}

function renderExam(daily) {
  const area = daily ? document.getElementById('daily-area') : document.getElementById('quiz-area');
  const qs = state.currentQ;
  const answered = state.currentAnswered;
  const totalDone = answered.filter(a=>a!==null).length;
  const pct = qs.length ? Math.round(totalDone/qs.length*100) : 0;

  let html = `<div class="card" style="margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <div style="font-weight:700;color:var(--gold);">${daily?'📅 التحدي اليومي':'📝 الامتحان'}</div>
      <div style="display:flex;gap:12px;align-items:center;">
        ${state.quizTimer>0&&!daily?`<div style="font-weight:900;color:var(--gold);" id="total-timer-val">${formatTime(totalTimerLeft)}</div>`:''}
        <span style="color:var(--green);font-weight:700;">✓ ${answered.filter(a=>a===true).length}</span>
        <span style="color:var(--red);font-weight:700;">✗ ${answered.filter(a=>a===false).length}</span>
        <span style="color:var(--muted);font-size:0.8em;">${totalDone}/${qs.length}</span>
      </div>
    </div>
    <div class="pbar" style="margin-top:8px;"><div class="pfill" style="width:${pct}%"></div></div>
    <div class="kb-hint">⌨️ اضغط 1-4 للإجابة</div>
  </div>`;

  area.innerHTML = html;

  qs.forEach((q, idx) => {
    const card = document.createElement('div');
    const ans = answered[idx];
    card.className = 'qcard' + (ans===true?' correct':ans===false?' wrong':'');
    card.id = 'qcard-' + idx;

    const subjBadge = `<span class="subj-badge ${q.s==='hist'?'sb-hist':'sb-geo'}">${q.s==='hist'?'تاريخ':'جغرافيا'} L${q.l}</span>`;
    const diffBadge = `<span class="diff-badge ${q.d==='easy'?'diff-e':q.d==='medium'?'diff-m':'diff-h'}">${q.d==='easy'?'سهل':q.d==='medium'?'متوسط':'صعب'}</span>`;

    // Per-question timer bar
    let timerHtml = '';
    if(state.quizTimer > 0 && state.quizTimer <= 100 && ans===null) {
      const pq = state.quizTimer;
      timerHtml = `<div class="timer-bar" id="ptimer-${idx}"><div class="timer-fill" id="ptimer-fill-${idx}" style="width:100%;background:var(--green);"></div></div>`;
    }

    const optsHtml = q.opts.map((opt, oi) => {
      let cls = 'opt';
      let disabled = '';
      if(ans!==null) {
        disabled='disabled';
        if(oi===q.a) cls+=' reveal';
        if(ans===false && oi===q.userAns) cls='opt wrong';
        if(ans===true && oi===q.a) cls='opt correct';
      }
      return `<button class="${cls}" ${disabled} onclick="answerQ(${idx},${oi})"><span class="opt-ltr">${LETTERS[oi]}</span>${opt}</button>`;
    }).join('');

    const expHtml = ans!==null ? `<div class="exp">💡 ${q.exp}</div>` : '';

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num">سؤال ${idx+1}</span>
        ${subjBadge}${diffBadge}
      </div>
      ${timerHtml}
      <div class="q-text">${q.q}</div>
      <div class="opts">${optsHtml}</div>
      ${expHtml}
    `;
    area.appendChild(card);
  });

  if(qs.every((_,i) => answered[i]!==null)) {
    renderResults(daily, area);
  } else {
    const btn = document.createElement('div');
    btn.style='text-align:center;margin:16px 0;';
    btn.innerHTML = `<button class="btn btn-s" onclick="resetExamFn()">🔄 إعادة</button>
      <button class="btn btn-s" onclick="showReviewWrong()">❌ مراجعة الأخطاء</button>`;
    area.appendChild(btn);
  }
}

function answerQ(idx, optIdx) {
  if(state.currentAnswered[idx]!==null) return;
  const q = state.currentQ[idx];
  const correct = optIdx === q.a;
  q.userAns = optIdx;
  state.currentAnswered[idx] = correct;

  // Stats
  state.totalAnswered++;
  if(correct) {
    state.totalCorrect++;
    state.streak++;
    state.comboCount++;
    if(state.streak > state.maxStreak) state.maxStreak = state.streak;
    if(state.comboCount >= 3) showToast(`🔥 سلسلة ${state.comboCount}!`);
    playSound('correct');
  } else {
    state.streak = 0;
    state.comboCount = 0;
    playSound('wrong');
  }
  updateHdrStreak();

  // Weak tracking
  const key = `${q.s}_l${q.l}`;
  if(!state.weakHistory[key]) state.weakHistory[key]={right:0,wrong:0};
  if(correct) state.weakHistory[key].right++; else state.weakHistory[key].wrong++;

  saveState();
  renderExam(state._dailyMode||false);

  setTimeout(() => {
    const card = document.getElementById('qcard-'+idx);
    if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
  }, 80);
}

function renderResults(daily, area) {
  const qs = state.currentQ;
  const score = state.currentAnswered.filter(a=>a===true).length;
  const total = qs.length;
  const pct = Math.round(score/total*100);
  let grade, gc;
  if(pct>=90){grade='ممتاز 🌟';gc='var(--gold)';}
  else if(pct>=75){grade='جيد جداً 👍';gc='var(--green)';}
  else if(pct>=60){grade='جيد ✓';gc='var(--blue)';}
  else if(pct>=50){grade='مقبول';gc='#c0a040';}
  else{grade='يحتاج مراجعة 📚';gc='var(--red)';}

  state.scores.push({score,total,pct,grade,time:new Date().toLocaleTimeString('ar')});
  if(daily) {
    state.dailyDone=true;
    const today=new Date().toISOString().slice(0,10);
    if(!state.dailyHistory) state.dailyHistory={};
    state.dailyHistory[today]=true;
  }
  checkAchievements(score,total,pct);
  saveState();

  const res = document.createElement('div');
  res.className='res-panel';
  res.style='margin-top:16px;';
  res.innerHTML=`
    <div style="font-size:2em;">🏆</div>
    <h3 style="color:var(--gold);margin:8px 0;">انتهى الامتحان!</h3>
    <div class="score-circle"><div class="stat-num" style="color:var(--gold);">${score}</div><div style="font-size:0.75em;color:var(--muted);">من ${total}</div></div>
    <div style="font-size:1.6em;font-weight:900;color:${gc};">${pct}%</div>
    <div style="background:${gc}22;color:${gc};border:1px solid ${gc};display:inline-block;padding:5px 20px;border-radius:20px;font-weight:700;margin:8px 0;">${grade}</div>
    <br>
    <button class="btn btn-g" onclick="resetExamFn()">🔄 إعادة</button>
    <button class="btn btn-s" onclick="showReviewWrong()">❌ مراجعة الأخطاء</button>
    <button class="btn btn-s" onclick="${daily?'renderDaily()':'showQuizConfig()'}">◀ رجوع</button>
  `;
  area.insertBefore(res, area.firstChild);
}

function showReviewWrong() {
  const wrong = state.currentQ.filter((_,i) => state.currentAnswered[i]===false);
  const rev = document.getElementById('quiz-review');
  if(!rev) return;
  document.getElementById('quiz-area').style.display='none';
  rev.style.display='block';
  rev.innerHTML=`<div class="card card-gold"><div style="font-weight:700;color:var(--red);margin-bottom:12px;">❌ الأسئلة التي أخطأتَ فيها (${wrong.length})</div>
  ${wrong.length===0?'<div style="color:var(--green);font-weight:700;">✅ لم تخطئ في أي سؤال!</div>':
  wrong.map(q=>`<div class="rw-card"><div class="rw-q">${q.q}</div>
  <div class="rw-your">❌ إجابتك: ${q.opts[q.userAns]}</div>
  <div class="rw-correct">✅ الصحيح: ${q.opts[q.a]}</div>
  <div class="exp" style="margin-top:8px;">💡 ${q.exp}</div></div>`).join('')}
  <button class="btn btn-g" style="margin-top:12px;" onclick="resetExamFn()">🔄 إعادة المحاولة</button>
  <button class="btn btn-s" onclick="showQuizConfig()">◀ رجوع</button></div>`;
}

function showQuizConfig() {
  clearAllTimers();
  document.getElementById('quiz-config').style.display='block';
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('quiz-review').style.display='none';
}

function resetExamFn() {
  const qs = shuffle([...state.currentQ]);
  qs.forEach(q => delete q.userAns);
  runExam(qs, state.quizSubj, state._dailyMode||false);
}

function clearAllTimers() {
  clearInterval(qTimerInterval);
  clearInterval(totalTimerInterval);
}

function formatTime(s) {
  return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;
}

// KEYBOARD SHORTCUTS
document.addEventListener('keydown', e => {
  if(['1','2','3','4'].includes(e.key)) {
    // Find first unanswered
    const idx = state.currentAnswered.findIndex(a=>a===null);
    if(idx>=0) answerQ(idx, parseInt(e.key)-1);
  }
});

// ==================== DAILY ====================
function renderDaily() {
  const area = document.getElementById('daily-area');
  const today = new Date().toISOString().slice(0,10);
  if(state.dailyDate===today && state.dailyDone) {
    area.innerHTML=`<div class="res-panel"><div style="font-size:2.5em;">✅</div><h3 style="color:var(--gold);">أحسنت! لقد أنهيت تحديث اليوم</h3><p style="color:var(--muted);">عد غداً للتحدي الجديد!</p><div class="streak-badge" style="display:inline-block;font-size:1.2em;margin-top:10px;">🔥 سلسلة ${state.streak} يوم</div></div>`;
    return;
  }
  state.dailyDate=today; state.dailyDone=false; state._dailyMode=true;
  const qs = shuffle([...ALL_Q]).slice(0,5);
  state.quizTimer=0;
  runExam(qs, 'mixed', true);
}

    </div>

  `;

function flipCard() {
  const c = document.getElementById('fc-main');
  state.fcFlipped = !state.fcFlipped;
  if(state.fcFlipped) c.classList.add('flipped'); else c.classList.remove('flipped');
}

function fcNav(dir) {
  state.fcIdx = (state.fcIdx + dir + state.fcDeck.length) % state.fcDeck.length;
  renderFlash();
}

function shuffleFlash() {
  state.fcDeck = shuffle([...FLASH_DATA]);
  state.fcIdx = 0;
  renderFlash();
}

function startExamLesson(subj, lesson) {
  const qs = shuffle(ALL_Q.filter(q=>q.s===subj && q.l===lesson));
  state.quizTimer=0; state._dailyMode=false;
  runExam(qs, subj, false);
  showPage('quiz');
}

function toggleSummary(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');

}

// ==================== SEARCH ====================
function doSearch(val) {
  const area = document.getElementById('search-results');
  if(!val || val.length < 2) { area.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;">اكتب للبحث...</div>'; return; }
  const lower = val.toLowerCase();
  const results = GLOSSARY.filter(g => g.term.includes(val) || g.def.includes(val) || g.lesson.includes(val));
  if(!results.length) { area.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;">لا توجد نتائج</div>'; return; }
  area.innerHTML = results.map(r => `<div class="search-result">
    <div class="sr-term">${highlight(r.term, val)}</div>
    <div class="sr-def">${highlight(r.def.substring(0,120)+'...', val)}</div>
    <div style="font-size:0.7em;color:var(--blue);margin-top:4px;">📚 ${r.lesson}</div>
  </div>`).join('');
}

function highlight(text, term) {
  return text.replace(new RegExp(term,'g'), `<mark>${term}</mark>`);
}

// ==================== WEAK POINTS ====================
const LESSON_NAMES = {
  hist_l1:'ت1: التحولات الاقتصادية',hist_l2:'ت2: التنافس الإمبريالي',hist_l3:'ت3: اليقظة الفكرية',
  hist_l4:'ت4: الضغوط الاستعمارية',hist_l5:'ت5: أوروبا 1919-1929',hist_l6:'ت6: الحرب العالمية الثانية',
  hist_l7:'ت7: نظام الحماية',hist_l8:'ت8: نضال الاستقلال',
  geo_l1:'ج1: مفهوم التنمية',geo_l2:'ج2: المجال المغربي',geo_l3:'ج3: إعداد التراب',
  geo_l4:'ج4: التهيئة الحضرية',geo_l5:'ج5: الماء والتصحر',geo_l6:'ج6: الولايات المتحدة',
  geo_l7:'ج7: الاتحاد الأوروبي',geo_l8:'ج8: الصين'
};

function renderWeak() {
  const area = document.getElementById('weak-area');
  const wh = state.weakHistory || {};
  const keys = Object.keys(LESSON_NAMES);
  const sorted = keys.map(k => {
    const d = wh[k]||{right:0,wrong:0};
    const total = d.right+d.wrong;
    const pct = total ? Math.round(d.right/total*100) : null;
    return {k, name:LESSON_NAMES[k], right:d.right, wrong:d.wrong, total, pct};
  }).filter(x=>x.total>0).sort((a,b)=>(a.pct||100)-(b.pct||100));

  if(!sorted.length) { area.innerHTML='<div class="card"><p style="color:var(--muted);text-align:center;padding:20px;">أجرِ بعض الاختبارات أولاً لتحليل نقاط ضعفك!</p></div>'; return; }

  area.innerHTML=`<div style="font-weight:700;color:var(--gold);margin-bottom:12px;">📊 تحليل أدائك حسب كل درس</div>`;
  sorted.forEach(({name,right,wrong,total,pct}) => {
    const cls = pct>=70?'wp-fill-good':pct>=40?'wp-fill-mid':'wp-fill-bad';
    const div = document.createElement('div');
    div.innerHTML=`<div class="card" style="margin-bottom:8px;padding:12px;">
      <div style="font-weight:600;font-size:0.85em;margin-bottom:6px;">${name}</div>
      <div class="wp-bar">
        <div class="wp-track"><div class="${cls}" style="width:${pct}%;"></div></div>
        <div class="wp-pct" style="color:${pct>=70?'var(--green)':pct>=40?'var(--gold)':'var(--red)'};">${pct}%</div>
      </div>
      <div style="font-size:0.75em;color:var(--muted);">✅ ${right} صحيح | ❌ ${wrong} خطأ | مجموع ${total}</div>
    </div>`;
    area.appendChild(div);
  });

  const noData = keys.filter(k=>!(wh[k]&&wh[k].right+wh[k].wrong>0));
  if(noData.length) {
    const d = document.createElement('div');
    d.innerHTML=`<div class="card"><div style="color:var(--muted);font-size:0.82em;font-weight:700;margin-bottom:6px;">📋 دروس لم تُختبر بعد:</div>${noData.map(k=>`<span style="display:inline-block;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:3px 8px;margin:2px;font-size:0.75em;">${LESSON_NAMES[k]}</span>`).join('')}</div>`;
    area.appendChild(d);
  }
}

// ==================== ACHIEVEMENTS ====================

  {id:'first',icon:'🎯',name:'الأول',desc:'أجب على سؤالك الأول'},
  {id:'perfect5',icon:'⭐',name:'خمسة من خمسة',desc:'نقاط كاملة في التحدي اليومي'},
  {id:'streak3',icon:'🔥',name:'سلسلة 3',desc:'3 إجابات صحيحة متتالية'},
  {id:'streak10',icon:'🔥🔥',name:'سلسلة 10',desc:'10 إجابات صحيحة متتالية'},
  {id:'hist_master',icon:'📜',name:'سيد التاريخ',desc:'80%+ في امتحان التاريخ الشامل'},
  {id:'geo_master',icon:'🌍',name:'خبير الجغرافيا',desc:'80%+ في امتحان الجغرافيا الشامل'},
  {id:'speed',icon:'⚡',name:'السرعة الفائقة',desc:'أنهِ امتحاناً مؤقتاً بنجاح'},
  {id:'answered50',icon:'🏅',name:'50 سؤال',desc:'أجب على 50 سؤالاً'},
  {id:'perfect',icon:'🌟',name:'الكمال',desc:'100% في أي امتحان'},
  {id:'daily7',icon:'📅',name:'أسبوع كامل',desc:'7 تحديات يومية متتالية'},
];

function checkAchievements(score, total, pct) {
  const ach = state.achievements || {};
  if(!ach.first) { ach.first=true; showNotif('🎯 إنجاز جديد: الأول!'); }
  if(state.streak>=3 && !ach.streak3) { ach.streak3=true; showNotif('🔥 إنجاز: سلسلة 3!'); }
  if(state.streak>=10 && !ach.streak10) { ach.streak10=true; showNotif('🔥🔥 إنجاز: سلسلة 10!'); }
  if(pct===100 && !ach.perfect) { ach.perfect=true; showNotif('🌟 إنجاز: الكمال!'); }
  if(state.totalAnswered>=50 && !ach.answered50) { ach.answered50=true; showNotif('🏅 إنجاز: 50 سؤال!'); }
  if(state._dailyMode && pct===100 && !ach.perfect5) { ach.perfect5=true; showNotif('⭐ إنجاز: خمسة من خمسة!'); }
  state.achievements = ach;
  saveState();
}

function renderAch() {
  const area = document.getElementById('ach-area');
  const ach = state.achievements || {};
  const unlocked = ACHIEVEMENTS_DEF.filter(a=>ach[a.id]).length;
  area.innerHTML=`<div style="font-weight:700;color:var(--gold);margin-bottom:6px;">🏅 الإنجازات والشارات</div>
  <div style="color:var(--muted);font-size:0.82em;margin-bottom:12px;">${unlocked} / ${ACHIEVEMENTS_DEF.length} مفتوح</div>
  <div class="pbar"><div class="pfill" style="width:${Math.round(unlocked/ACHIEVEMENTS_DEF.length*100)}%"></div></div>
  <div class="ach-grid" style="margin-top:14px;">
  ${ACHIEVEMENTS_DEF.map(a=>`<div class="ach-item ${ach[a.id]?'unlocked':'ach-locked'}">
    <div class="ach-icon">${a.icon}</div>
    <div class="ach-name">${a.name}</div>
    <div class="ach-desc">${a.desc}</div>
    ${ach[a.id]?'<div style="color:var(--green);font-size:0.7em;margin-top:4px;">✅ مفتوح</div>':'<div style="color:var(--muted);font-size:0.7em;margin-top:4px;">🔒 مغلق</div>'}
  </div>`).join('')}
  </div>`;
}

// ==================== LEADERBOARD ====================
function renderLb() {
  const area = document.getElementById('lb-area');
  const scores = (state.scores || []).slice(-20).reverse();
  area.innerHTML=`<div style="font-weight:700;color:var(--gold);margin-bottom:12px;">🏆 سجل النتائج (آخر الجلسات)</div>`;
  if(!scores.length) { area.innerHTML+='<div class="card"><p style="color:var(--muted);text-align:center;">لا توجد نتائج بعد!</p></div>'; return; }

    <div class="lb-pct">${pct}%</div>`;
    area.appendChild(div);
  });
}

// ==================== UTILS ====================
function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
